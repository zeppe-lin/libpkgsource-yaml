name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC shared
            cc: gcc
            cxx: g++
            mode: shared
            html_docs: enabled
          - name: GCC static
            cc: gcc
            cxx: g++
            mode: static
            html_docs: disabled
          - name: Clang shared
            cc: clang
            cxx: clang++
            mode: shared
            html_docs: disabled
          - name: Clang static
            cc: clang
            cxx: clang++
            mode: static
            html_docs: disabled
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - name: Check out libpkgsource-yaml
        uses: actions/checkout@v4

      - name: Check out libpkgsource 3.0.0
        uses: actions/checkout@v4
        with:
          repository: zeppe-lin/libpkgsource
          ref: v3.0.1
          path: dependencies/libpkgsource

      - name: Check out upstream libyaml 0.2.5
        uses: actions/checkout@v4
        with:
          repository: yaml/libyaml
          ref: 2c891fc7a770e8ba2fec34fc6b545c672beb37e6
          path: dependencies/libyaml

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            autoconf \
            automake \
            binutils \
            clang \
            clang-format-17 \
            doxygen \
            libssl-dev \
            libtool \
            make \
            mandoc \
            meson \
            ninja-build \
            pandoc \
            pkg-config

      - name: Build and install provider and semantic owner
        shell: bash
        run: |
          set -euo pipefail
          prefix="$RUNNER_TEMP/prefix"

          (
            cd dependencies/libyaml
            ./bootstrap
            ./configure \
              --prefix="$prefix" \
              --libdir="$prefix/lib" \
              --disable-dependency-tracking
            make -j2
            make install
          )

          export PKG_CONFIG_PATH="$prefix/lib/pkgconfig"
          meson setup dependencies/libpkgsource/build \
            dependencies/libpkgsource \
            --prefix="$prefix" \
            --libdir=lib \
            -Ddefault_library=${{ matrix.mode }} \
            -Dlink_mode=${{ matrix.mode }} \
            -Dtests=disabled \
            -Dman_pages=disabled \
            -Dwerror=true
          meson compile -C dependencies/libpkgsource/build
          meson install -C dependencies/libpkgsource/build

          echo "PREFIX=$prefix" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$prefix/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$prefix/lib" >> "$GITHUB_ENV"

      - name: Configure, build, and test
        run: |
          meson setup build \
            --prefix="$PREFIX" \
            --libdir=lib \
            -Ddefault_library=${{ matrix.mode }} \
            -Dlink_mode=${{ matrix.mode }} \
            -Dman_pages=enabled \
            -Dhtml_docs=${{ matrix.html_docs }} \
            -Dwerror=true
          meson compile -C build
          meson test -C build --print-errorlogs

      - name: Qualify public API documentation
        if: matrix.name == 'GCC shared'
        run: doxygen Doxyfile

      - name: Qualify manuals
        run: |
          find build/docs/man -type f \
            \( -name '*.3' -o -name '*.5' \) \
            -exec mandoc -Tlint {} +

      - name: Qualify staged documentation install
        shell: bash
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/stage"
          rm -rf "$stage"
          meson install -C build --destdir "$stage"
          tests/contracts/check_installed_docs.sh "$stage$PREFIX"
          if [[ '${{ matrix.html_docs }}' == enabled ]]; then
            tests/contracts/check_installed_html_docs.sh \
              "$stage$PREFIX" 1.0.1
          fi

      - name: Install
        run: meson install -C build

      - name: Qualify installed consumer and metadata closure
        shell: bash
        run: |
          set -euo pipefail
          flags=()
          if [[ '${{ matrix.mode }}' == static ]]; then
            flags+=(--static)
          fi
          "$CXX" -std=c++17 -Wall -Wextra -Wpedantic -Werror \
            tests/installed/parser_consumer.cpp \
            $(pkg-config "${flags[@]}" --cflags --libs libpkgsource-yaml) \
            -o installed-consumer
          ./installed-consumer
          test "$(pkg-config --modversion libpkgsource-yaml)" = 1.0.1

      - name: Audit shared dependency boundary
        if: matrix.mode == 'shared'
        shell: bash
        run: |
          set -euo pipefail
          library=$(find build -type f -name 'libpkgsource-yaml.so.*' \
            ! -type l -print -quit)
          readelf -d "$library" | tee yaml.dynamic
          grep -F 'Library soname: [libpkgsource-yaml.so.1]' yaml.dynamic
          grep -F 'Shared library: [libpkgsource.so.3]' yaml.dynamic
          grep -E 'Shared library: \[libyaml[^]]*\.so' yaml.dynamic
          ! grep -E 'libcrypto|libpkgsource-codec|libpkgsource-plan|libpkgplan' \
            yaml.dynamic

  sanitizers:
    name: ${{ matrix.name }} sanitizers
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC
            cc: gcc
            cxx: g++
          - name: Clang
            cc: clang
            cxx: clang++
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      ASAN_OPTIONS: halt_on_error=1:abort_on_error=1:detect_leaks=1
      UBSAN_OPTIONS: halt_on_error=1:abort_on_error=1:print_stacktrace=1
    steps:
      - name: Check out libpkgsource-yaml
        uses: actions/checkout@v4

      - name: Check out libpkgsource 3.0.0
        uses: actions/checkout@v4
        with:
          repository: zeppe-lin/libpkgsource
          ref: v3.0.1
          path: dependencies/libpkgsource

      - name: Check out upstream libyaml 0.2.5
        uses: actions/checkout@v4
        with:
          repository: yaml/libyaml
          ref: 2c891fc7a770e8ba2fec34fc6b545c672beb37e6
          path: dependencies/libyaml

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            autoconf \
            automake \
            clang \
            libssl-dev \
            libtool \
            make \
            meson \
            ninja-build \
            pkg-config

      - name: Build provider and sanitized semantic owner
        shell: bash
        run: |
          set -euo pipefail
          prefix="$RUNNER_TEMP/prefix"

          (
            cd dependencies/libyaml
            ./bootstrap
            ./configure \
              --prefix="$prefix" \
              --libdir="$prefix/lib" \
              --disable-dependency-tracking
            make -j2
            make install
          )

          export PKG_CONFIG_PATH="$prefix/lib/pkgconfig"
          meson setup dependencies/libpkgsource/build \
            dependencies/libpkgsource \
            --prefix="$prefix" \
            --libdir=lib \
            -Ddefault_library=shared \
            -Dlink_mode=shared \
            -Dtests=disabled \
            -Dman_pages=disabled \
            -Db_sanitize=address,undefined \
            -Db_lundef=false \
            -Dwerror=true
          meson compile -C dependencies/libpkgsource/build
          meson install -C dependencies/libpkgsource/build

          echo "PKG_CONFIG_PATH=$prefix/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$prefix/lib" >> "$GITHUB_ENV"

      - name: Configure, build, and test
        run: |
          meson setup build \
            -Ddefault_library=shared \
            -Dlink_mode=shared \
            -Dman_pages=disabled \
            -Dhtml_docs=disabled \
            -Db_sanitize=address,undefined \
            -Db_lundef=false \
            -Dwerror=true
          meson compile -C build
          meson test -C build --print-errorlogs
